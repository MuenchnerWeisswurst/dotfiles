# ~/.config/alacritty/alacritty.toml

[env]
TERM = "xterm-256color"           # wichtig für tmux/neovim etc.

[window]
padding.x = 12
padding.y = 10
decorations = "buttonless"        # macOS: schöner ohne Titelleiste
opacity = 0.88                    # leicht transparent
blur = true                       # Hintergrundunschärfe (macOS only)
startup_mode = "Windowed"
dynamic_title = true
option_as_alt = "both"            # beide ⌥-Tasten = Alt (sehr nützlich!)

[scrolling]
history = 15000                   # mehr Scrollback
multiplier = 3

[font]
normal.family    = "JetBrainsMono Nerd Font"
normal.style     = "Regular"
bold.family      = "JetBrainsMono Nerd Font"
bold.style       = "Bold"
italic.family    = "JetBrainsMono Nerd Font"
italic.style     = "Italic"
bold_italic.family = "JetBrainsMono Nerd Font"
bold_italic.style  = "Bold Italic"

size = 13.5

offset = { x = 0, y = 1 }         # leicht nach unten verschieben → schöner Look

[colors]
# Eine schöne dark-theme Variante (ähnlich One Dark / Catppuccin)
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Beam", blinking = "Off" }
unfocused_hollow = true
thickness = 0.15

[bell]
animation = "EaseOutExpo"
duration = 0
color = "#ffffff"

[selection]
save_to_clipboard = true          # Auswahl landet direkt in der Zwischenablage
[general]
live_config_reload = true
